[pytest]
testpaths = tests
markers =
    requires_real_hycom: integration test that requires the real production HYCOM NetCDF dataset (skipped with an explanation when the data is not installed locally)

# Third-party deprecations, characterised and deliberately not silenced globally.
# Each is named rather than blanket-filtered so a NEW warning still surfaces.
filterwarnings =
    # fastapi/starlette: TestClient will move to httpx2. Nothing in this repo
    # controls that migration, and the warning fires on import of the library.
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:DeprecationWarning
    ignore:Using `httpx` with `starlette.testclient` is deprecated.*:Warning
    # starlette -> anyio: BlockingPortal alias moved to anyio.from_thread.
    ignore:The anyio.abc.BlockingPortal alias is deprecated.*:DeprecationWarning
    # xarray's netCDF4 backend still assigns array shape, which NumPy 2.5
    # deprecated. Upstream issue; the read path is exercised by the suite.
    ignore:Setting the shape on a NumPy array has been deprecated.*:DeprecationWarning
